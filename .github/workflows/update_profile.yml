name: generate images

on:
#  schedule:
#    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ fromJSON(((((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && vars.NEXUS_RUNS_ON_LINUX) || '["ubuntu-26.04"]')) }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate light & dark portraits
        run: python scripts/generate_images.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile_light.png profile_dark.png
          git commit -m "chore: regenerate profile images" || echo "No changes to commit"
          git push
